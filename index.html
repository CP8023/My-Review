<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>工作复盘</title>
  <meta name="description" content="只属于你的每日工作复盘。数据保存在本机，不上传任何服务器。">
  <meta name="theme-color" content="#2F5D50">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var pref = 'auto';
        var raw = localStorage.getItem('work-review-v1');
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.settings && data.settings.theme) pref = data.settings.theme;
        }
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (err) { /* 忽略：使用默认浅色 */ }
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="复盘">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/views.css">
</head>

  <div class="app">

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">

            <rect width="28" height="28" rx="8" fill="#2F5D50"/>
            <rect x="8" y="6.5" width="12" height="15" rx="2" fill="#FBF7EF"/>
            <path d="M11 11h6M11 14.5h6M11 18h3.5" stroke="#9FBFB2" stroke-width="1.4" stroke-linecap="round"/>
            <rect x="16.4" y="5.4" width="3.4" height="7" rx="1" fill="#C8734F"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">复盘</span>
          <span class="brand-sub">WORK REVIEW</span>
        </span>
      </div>

      <nav class="nav" aria-label="主导航">
        <button type="button" class="nav-item" data-nav="write">

          <span>时间线</span>

          <span>项目</span>
        </button>
        <button type="button" class="nav-item" data-nav="actions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>行动</span>

          数据只保存在本机
        </p>

    </aside>

        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./js/data.js"></script>
  <script src="./js/editor.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/review.js"></script>
  <script src="./js/actions.js"></script>

  <script src="./js/app.js"></script>
